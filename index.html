<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#14121f" />
<title>弹个痛快 BANKSHOT!</title>
<link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="menu" class="ov">
    <div class="panel">
      <div class="logo">弹个痛快</div>
      <div class="logo2">BANKSHOT!</div>
      <p class="tag">拖动瞄准 · 松手发射 · 贴墙反弹叠倍率</p>
      <button id="bDaily" class="btn big">每日挑战 <span id="dDate"></span></button>
      <button id="bFree" class="btn">自由模式</button>
      <div id="stats" class="stats"></div>
      <details class="how"><summary>怎么玩</summary>
        <p>按住屏幕拖动瞄准，松手射出一串弹珠。弹珠<b>每撞一次墙倍率 +1</b>，每打碎一块砖 +0.5。得分 = 砖块数字 × 倍率。</p>
        <p><b>每关都有门闩缺口</b>：先打破发亮的 🔒 门闩，才能大面积清除后方高分区。乱炸锁区收效甚微。</p>
        <p>每关 5 发，达到分数门槛即可过关。第 7 关是 Boss，之后可一直打到 <b>1000+ 关</b>（程序化阵型，每关一种缺口）。</p>
        <p>过关后三选一。金砖 ¥、炸弹 ✸、+1 弹珠、×2 倍率砖。飞行中可点屏幕加速或点「召回」。</p>
      </details>
    </div>
  </div>
  <div id="decide" class="ov hidden">
    <div class="panel">
      <h2>达标！🎯</h2>
      <p id="decTxt"></p>
      <button id="bCash" class="btn big">过关，拿 <span id="decCoins"></span> 金币</button>
      <button id="bGreed" class="btn">继续贪分（超出部分也换金币）</button>
    </div>
  </div>
  <div id="pick" class="ov hidden">
    <div class="panel wide">
      <h2 id="pickTitle">第 1 关通过！</h2>
      <p class="sub" id="pickSub">三选一</p>
      <div id="cards"></div>
      <div class="row"><button id="bReroll" class="btn small">刷新（2 金币）</button><button id="bSkip" class="btn small ghost">跳过</button></div>
    </div>
  </div>
  <div id="over" class="ov hidden">
    <div class="panel">
      <h2 id="ovTitle">游戏结束</h2>
      <p id="ovSub" class="sub"></p>
      <pre id="ovShare"></pre>
      <button id="bAgain" class="btn big">再来一把</button>
      <button id="bShare" class="btn">复制战绩分享</button>
      <button id="bEndless" class="btn hidden">继续：无尽模式</button>
      <button id="bHome" class="btn small ghost">回到主页</button>
    </div>
  </div>
  <button id="bRecall" class="recall hidden" type="button">召回弹珠</button>
  <div id="toast" class="hidden"></div>
</div>
<script src="core.js?v=4"></script>
<script src="game.js?v=4"></script>
</body>
</html>
